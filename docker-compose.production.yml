services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg15-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-teamsynch-ai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-teamsynch-ai_prod}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-teamsynch-ai} -d ${DB_NAME:-teamsynch-ai_prod}
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - teamsynch-ai

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - teamsynch-ai

  migrate:
    image: teamsynch-ai-api

    command:
      - node
      - /app/node_modules/prisma/build/index.js
      - migrate
      - deploy

    environment:
      DATABASE_URL: postgresql://${DB_USER:-teamsynch-ai}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-teamsynch-ai_prod}
      DIRECT_DATABASE_URL: postgresql://${DB_USER:-teamsynch-ai}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-teamsynch-ai_prod}

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

    networks:
      - teamsynch-ai

  api:
    image: teamsynch-ai-api

    build:
      context: .
      dockerfile: apps/api/Dockerfile

    restart: unless-stopped

    ports:
      - "${API_PORT:-4000}:4000"

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-teamsynch-ai}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-teamsynch-ai_prod}
      DIRECT_DATABASE_URL: postgresql://${DB_USER:-teamsynch-ai}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-teamsynch-ai_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      # BUG FIX (#106, 2026-08-06): seals stored calendar OAuth tokens.
      # Missing from every checklist until now, the service silently used
      # a repo-published fallback key. Mandatory interpolation makes a
      # missing value a Compose-time error, before the API ever boots.
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY:?ENCRYPTION_SECRET_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:-teamsynch-ai-api}
      JWT_ACCESS_AUDIENCE: ${JWT_ACCESS_AUDIENCE:-teamsynch-ai-api}
      JWT_REFRESH_AUDIENCE: ${JWT_REFRESH_AUDIENCE:-teamsynch-ai-auth}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      AI_MODEL: ${AI_MODEL:?AI_MODEL is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1000}

    # PRODUCTION READINESS (2026-08-06): with the default LOCAL storage
    # provider, uploaded document bytes live under /app/apps/api/uploads
    # (LocalStorageProvider resolves process.cwd()/uploads; the Dockerfile
    # pre-creates it chowned to node). Without this named volume every
    # image redeploy silently destroyed every user upload, with the DB
    # rows left pointing at gone bytes. S3 deployments (STORAGE_PROVIDER=s3)
    # externalize object durability and do not depend on this volume.
    volumes:
      - api_uploads:/app/apps/api/uploads

    depends_on:
      migrate:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:4000/api/v1/system/ready >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - teamsynch-ai

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    restart: unless-stopped

    ports:
      - "${WEB_PORT:-80}:80"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - teamsynch-ai

volumes:
  postgres_data:
  redis_data:
  api_uploads:

networks:
  teamsynch-ai:
    driver: bridge
