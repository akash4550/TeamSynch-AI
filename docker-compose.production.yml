services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg15-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-teamsynch-ai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-teamsynch-ai_prod}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-teamsynch-ai} -d ${DB_NAME:-teamsynch-ai_prod}
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - teamsynch-ai

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - teamsynch-ai

  migrate:
    image: teamsynch-ai-api

    command:
      - npm
      - run
      - migrate:deploy

    environment:
      DATABASE_URL: postgresql://${DB_USER:-teamsynch-ai}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-teamsynch-ai_prod}
      DIRECT_DATABASE_URL: postgresql://${DB_USER:-teamsynch-ai}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-teamsynch-ai_prod}

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

    networks:
      - teamsynch-ai

  api:
    image: teamsynch-ai-api

    build:
      context: .
      dockerfile: apps/api/Dockerfile

    restart: unless-stopped

    ports:
      - "${API_PORT:-4000}:4000"

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-teamsynch-ai}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-teamsynch-ai_prod}
      DIRECT_DATABASE_URL: postgresql://${DB_USER:-teamsynch-ai}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-teamsynch-ai_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-teamsynch-ai-api}
      JWT_ACCESS_AUDIENCE: ${JWT_ACCESS_AUDIENCE:-teamsynch-ai-api}
      JWT_REFRESH_AUDIENCE: ${JWT_REFRESH_AUDIENCE:-teamsynch-ai-auth}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      AI_MODEL: ${AI_MODEL:?AI_MODEL is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1000}

    depends_on:
      migrate:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:4000/api/v1/system/ready >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - teamsynch-ai

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    restart: unless-stopped

    ports:
      - "${WEB_PORT:-80}:80"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - teamsynch-ai

volumes:
  postgres_data:
  redis_data:

networks:
  teamsynch-ai:
    driver: bridge
