<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /*
       * Theme bootstrap — runs synchronously BEFORE first paint so dark-mode
       * users never see a light flash (FOUC) while the React bundle loads.
       * Mirrors the class-resolution logic in src/components/layout/ThemeToggle.tsx
       * against the zustand-persisted key from src/store/uiStore.ts
       * ("teamsynch-ai-ui-storage"). Only the `dark` class is needed pre-paint
       * (`light` is a visual no-op); ThemeToggle re-reconciles after mount.
       */
      (function () {
        var theme = 'system';
        try {
          var stored = window.localStorage.getItem('teamsynch-ai-ui-storage');
          var persisted = stored ? JSON.parse(stored) : null;
          var value = persisted && persisted.state && persisted.state.theme;
          if (value === 'light' || value === 'dark' || value === 'system') {
            theme = value;
          }
        } catch (error) {
          /* localStorage blocked or payload corrupted — fall back to system */
        }
        var systemDark = false;
        try {
          systemDark = Boolean(
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          );
        } catch (error) {
          /* matchMedia unavailable — treat as light */
        }
        if (theme === 'dark' || (theme === 'system' && systemDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeamSynch AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
