map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream teamsynch_ai_api {
    server api:4000;
}

server {
    listen 80;
    server_name _;

    # PRODUCTION READINESS (2026-08-06): without an explicit directive,
    # nginx rejects request bodies > 1MB with its own bare 413 HTML page —
    # while the API honestly accepts up to multer's 50MB (document/logo
    # uploads, mapped by errorMiddleware to a JSON envelope 413). Every
    # 1–50MB upload would have failed AT THE EDGE in a way the SPA cannot
    # parse. 52m > 50m deliberately: files up to the real cap reach the
    # API's honest envelope; only truly oversized bodies stop at nginx.
    client_max_body_size 52m;

    location /api/ {
        proxy_pass http://teamsynch_ai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://teamsynch_ai_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # BUG FIX (#108, 2026-08-06 — the SPA shell was served with ZERO
        # security headers, and the production auth cookie is
        # SameSite=None BY DESIGN (auth.cookie.ts), so it is sent inside
        # cross-site iframes): every authenticated page — billing
        # settings, team deletion, admin invites — was clickjackable by
        # any hostile site framing app.<domain>. helmet() in the API only
        # covers /api/ responses, never this index.html. These directives
        # are scoped to THIS location block on purpose: server-level
        # add_header would ALSO decorate the proxied /api/ responses that
        # helmet already headers (duplicate X-Frame-Options/Referrer-
        # Policy header lines), and location-level add_header replaces
        # rather than merges inherited values. `always` keeps them on
        # error responses too (e.g. the 50x page path).
        #   - X-Frame-Options DENY + CSP frame-ancestors 'none': the two
        #     generations of frame-busting; framed load is refused.
        #   - X-Content-Type-Options nosniff: MIME sniffing off.
        #   - Referrer-Policy: default SPA navigation stops leaking full
        #     URLs (which carry query strings) to third parties.
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
