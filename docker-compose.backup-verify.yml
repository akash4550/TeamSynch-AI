name: teamsynch-ai-backup-verify

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg15-bookworm
    environment:
      POSTGRES_USER: teamsynch-ai_restore
      POSTGRES_PASSWORD: teamsynch-ai_restore
      POSTGRES_DB: teamsynch-ai_restore
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - restore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U teamsynch-ai_restore -d teamsynch-ai_restore",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  restore_postgres_data: