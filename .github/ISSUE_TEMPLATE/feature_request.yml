name: Feature request
description: Propose an improvement or new capability for TeamSynch AI
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Describe the user problem before proposing implementation details.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user, business, operational, or developer problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior and user experience.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Authentication and authorization
        - Projects and tasks
        - CRM
        - Documents
        - Real-time collaboration
        - AI and search
        - Billing
        - Analytics and audit
        - API and integrations
        - Web application
        - Infrastructure and deployment
        - Developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or alternative solutions you considered.
  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
      description: List observable outcomes that would make this request complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add diagrams, screenshots, examples, compatibility concerns, or migration implications.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and pull requests for similar requests.
          required: true
        - label: This request does not disclose a security vulnerability.
          required: true
