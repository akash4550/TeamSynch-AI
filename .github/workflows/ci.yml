name: TeamSynch AI CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg15-bookworm
        env:
          POSTGRES_USER: teamsynch-ai_test
          POSTGRES_PASSWORD: teamsynch-ai_test
          POSTGRES_DB: teamsynch-ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamsynch-ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://teamsynch-ai_test:teamsynch-ai_test@127.0.0.1:5432/teamsynch-ai_test
      DIRECT_DATABASE_URL: postgresql://teamsynch-ai_test:teamsynch-ai_test@127.0.0.1:5432/teamsynch-ai_test
      AUTH_TEST_DATABASE_URL: postgresql://teamsynch-ai_test:teamsynch-ai_test@127.0.0.1:5432/teamsynch-ai_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-access-token-secret-change-me-now
      JWT_REFRESH_SECRET: ci-refresh-token-secret-change-me-now
      JWT_ISSUER: teamsynch-ai-api
      JWT_ACCESS_AUDIENCE: teamsynch-ai-api
      JWT_REFRESH_AUDIENCE: teamsynch-ai-auth
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate

      - name: Deploy committed database migrations
        run: npm run test:db:migrate

      - name: Type-check workspaces with their declared compilers
        run: npm run typecheck

      - name: Run API tests
        run: npm test

      - name: Run frontend authentication tests
        run: npm run test --workspace=web

      - name: Build production application artifacts
        run: npm run build

  production-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      COMPOSE_PROJECT_NAME: teamsynch-ai-ci
      API_PORT: '14000'
      WEB_PORT: '18080'
      SMOKE_WEB_URL: http://127.0.0.1:18080
      JWT_ACCESS_SECRET: ci-production-access-secret-change-me
      JWT_REFRESH_SECRET: ci-production-refresh-secret-change-me
      # BUG FIX (#109, 2026-08-06): #106 made this variable mandatory for
      # any production boot — including this job's isolated production
      # topology — and docker-compose.production.yml's :? interpolation
      # turns its absence into a COMPOSE-TIME error. CI-only value, never
      # a real secret, ≥32 chars and distinct from the JWT values, exactly
      # like the placeholders beside it.
      ENCRYPTION_SECRET_KEY: ci-production-encryption-secret-change-me
      FRONTEND_URL: http://127.0.0.1:18080
      AI_PROVIDER: OPENAI
      AI_MODEL: ci-openai-model
      OPENAI_API_KEY: ci-openai-key-not-used
      AI_TIMEOUT_MS: 30000
      AI_MAX_OUTPUT_TOKENS: 1000
      DB_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build production Docker images
        run: npm run docker:build

      - name: Start isolated production topology
        run: docker compose -f docker-compose.production.yml up -d --no-build --wait postgres redis api web

      - name: Prepare isolated production authentication fixture
        run: npm run smoke:prepare-auth

      - name: Validate production startup and routing
        run: npm run smoke:production

      - name: Run Trivy Vulnerability Scanner on API Image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: teamsynch-ai-api:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Show production logs on failure
        if: failure()
        run: docker compose -f docker-compose.production.yml logs --no-color

      - name: Stop isolated production topology
        if: always()
        run: docker compose -f docker-compose.production.yml down -v
