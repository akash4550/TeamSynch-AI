name: Enterprise CI/CD Pipeline & Architecture Gatekeeper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-typecheck:
    name: 1. Strict Typecheck & Code Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Setup Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate -w apps/api

      - name: Run Workspace Typecheck (tsc --noEmit)
        run: npm run typecheck

  integration-tests:
    name: 2. Containerized Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]

    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg15-bookworm
        env:
          POSTGRES_USER: teamsynch-ai_test
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: teamsynch-ai_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://teamsynch-ai_test:test_password_123@localhost:5432/teamsynch-ai_test_db
      DIRECT_DATABASE_URL: postgresql://teamsynch-ai_test:test_password_123@localhost:5432/teamsynch-ai_test_db
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test_jwt_access_secret_key_minimum_32_characters
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_minimum_32_characters
      FRONTEND_URL: http://localhost:5173
      AI_PROVIDER: MOCK
      STORAGE_PROVIDER: local

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Setup Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate --workspace=api

      - name: Deploy Prisma Test Migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Execute API Unit & Security Integration Test Suite
        run: npm run test -w apps/api

  docker-security-scan:
    name: 3. Production Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Production API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: teamsynch-ai-api:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: teamsynch-ai-api:local
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  gatekeeper-summary:
    name: 4. Release Gatekeeper Summary
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, integration-tests, docker-security-scan]
    if: always()
    steps:
      - name: Verify All Pipeline Stage Success
        run: |
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.docker-security-scan.result }}" != "success" ]; then
            echo "CI/CD Gatekeeper Failed: One or more prerequisite jobs failed."
            exit 1
          fi
          echo "CI/CD Gatekeeper Passed: All architectural boundaries and tests verified."
